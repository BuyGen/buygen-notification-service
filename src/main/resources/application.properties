spring.application.name=notification-service
server.port=8083

#Mail Properties

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=9c4044646b65a8
spring.mail.password=e2bf4e4201505c

#Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-v2
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8091
spring.kafka.consumer.properties.specific.avro.reader=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observation.key-values.application=notification-service
management.endpoint.health.show-details=always
# ===============================
# Tracing (Micrometer)
# ===============================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# ===============================
# Zipkin (Tracing Export)
# ===============================
management.zipkin.tracing.enabled=true
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ===============================
# Make observability NON-FATAL
# ===============================
logging.level.org.springframework.boot.actuate.autoconfigure.tracing=WARN
logging.level.zipkin2=ERROR
logging.level.brave=ERROR

# ===============================
# Loki (Log shipping)
# ===============================
logging.level.com.github.loki4j=WARN
logging.level.com.github.loki4j.client=ERROR
